trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerHubUser: 'abdulrzzaq'   # عدلها لاسمك في Docker Hub

steps:
- task: DockerInstaller@0
  displayName: Install Docker

- task: Docker@2
  displayName: Build and push backend image
  inputs:
    containerRegistry: 'DockerHubServiceConnection'  # لازم تضيفها في Azure DevOps
    repository: '$(dockerHubUser)/backend-trainer-portal'
    command: 'buildAndPush'
    Dockerfile: 'devops-project-trainer-portal/api/Dockerfile'
    tags: |
      latest

- task: Docker@2
  displayName: Build and push frontend image
  inputs:
    containerRegistry: 'DockerHubServiceConnection'
    repository: '$(dockerHubUser)/frontend-trainer-portal'
    command: 'buildAndPush'
    Dockerfile: 'devops-project-trainer-portal/ui/Dockerfile'
    tags: |
      latest
